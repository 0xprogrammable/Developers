name: Live read-only smoke

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-read-only-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify published read surfaces
    if: github.repository == '0xprogrammable/developers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PROGRAMMABLE_API_BASE: "https://developers.programmable.family"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run repository checks
        run: npm run check

      - name: Run read-only live smoke
        run: npm run smoke:live
