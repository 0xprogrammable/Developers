        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: ./node_modules/.bin/vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"

      - name: Provider-requery current and rollback target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          target_id="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/validated-promotion.json \
            --path previousRelease.deployment.id)"
