          prepared_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          restored_mode="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/validated-promotion.json --path previousRelease.mode)"
          args=(
            --promotion-receipt .release-evidence/rollback/promotion/promotion-receipt.json
            --promotion-artifact-evidence .release-evidence/rollback/promotion-artifact-evidence.json
            --bundle .release-evidence/rollback/promotion/promotion-bundle.json
            --current-smoke .release-evidence/rollback/current-smoke.json
            --current-deployment .release-evidence/rollback/current-deployment.json
            --target-smoke .release-evidence/rollback/target-smoke.json
            --target-deployment .release-evidence/rollback/target-deployment.json
            --target-protection-evidence .release-evidence/rollback/target-protection.json
            --org-id "$VERCEL_ORG_ID" --project-id "$VERCEL_PROJECT_ID"
            --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF"
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
            --actor "$GITHUB_ACTOR" --actor-id "$GITHUB_ACTOR_ID"
            --prepared-at "$prepared_at"
            --output .release-evidence/rollback/rollback-plan.json
          )
          if test "$restored_mode" = live; then
            args+=(--previous-bundle .release-evidence/rollback/promotion/previous-promotion-bundle.json)
            cp .release-evidence/rollback/promotion/previous-promotion-bundle.json \
              .release-evidence/rollback/previous-promotion-bundle.json
          fi
          npm run release:vercel -- create-rollback-plan "${args[@]}"
          cp .release-evidence/rollback/promotion/promotion-bundle.json \
            .release-evidence/rollback/promotion-bundle.json
          digest="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/rollback-plan.json --path rollbackPlanDigest)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          rm -rf .release-evidence/rollback/promotion
          git diff --exit-code

      - name: Upload immutable rollback plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: developers-vercel-rollback-plan-${{ github.run_id }}-${{ github.run_attempt }}
