          npm run release:vercel -- inspect \
            --kind promotion \
            --file .release-evidence/rollback/promotion/promotion-receipt.json \
            --bundle .release-evidence/rollback/promotion/promotion-bundle.json \
            --output .release-evidence/rollback/validated-promotion.json

