          if-no-files-found: error
          retention-days: 7

      - name: Present exact rollback for protected owner review
        run: |
          plan=.release-evidence/rollback/rollback-plan.json
          {
            printf '### Canonical owner-dispatched rollback plan\n\n'
            printf -- '- Plan: `%s`\n' "$(npm run --silent release:vercel -- field --file "$plan" --path rollbackPlanDigest)"
            printf -- '- Current deployment: `%s`\n' "$(npm run --silent release:vercel -- field --file "$plan" --path currentDeployment.id)"
            printf -- '- Target deployment: `%s`\n' "$(npm run --silent release:vercel -- field --file "$plan" --path rollbackDeployment.id)"
            printf -- '- Restored mode: `%s`\n' "$(npm run --silent release:vercel -- field --file "$plan" --path rollbackTarget.mode)"
            printf -- '- Promotion receipt: `%s`\n' "$(npm run --silent release:vercel -- field --file "$plan" --path promotionReceiptDigest)"
            printf -- '- Indexer evidence: `%s`\n' "$(npm run --silent release:vercel -- field --file "$plan" --path indexerEvidence.indexerEvidenceDigest)"
          } >> "$GITHUB_STEP_SUMMARY"

