            printf -- '- Current deployment: `%s`\n' "$(npm run --silent release:vercel -- field --file "$plan" --path previousRelease.deployment.id)"
            printf -- '- Current mode: `%s`\n' "$(npm run --silent release:vercel -- field --file "$plan" --path previousRelease.mode)"
            printf -- '- Stage source: `%s` / `%s`\n' \
