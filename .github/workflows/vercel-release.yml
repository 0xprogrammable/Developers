            --artifact-name "developers-vercel-promotion-$PROMOTION_RUN_ID-$PROMOTION_RUN_ATTEMPT" \
            --run-output .release-evidence/rollback/promotion-run-evidence.json \
            --artifact-output .release-evidence/rollback/promotion-artifact-evidence.json

