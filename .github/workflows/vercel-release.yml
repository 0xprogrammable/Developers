            --actor "$GITHUB_ACTOR" --actor-id "$GITHUB_ACTOR_ID" \
            --authorized-at "$authorized_at" \
            --output .release-evidence/rollback/authorization.json
          rm .release-evidence/rollback/owner-dispatch-run.raw.json \
            .release-evidence/rollback/production-environment.raw.json

      - name: Pull exact Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: ./node_modules/.bin/vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"

      - name: Fresh provider-requery current and target deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          plan=.release-evidence/rollback/rollback-plan.json
          target_id="$(npm run --silent release:vercel -- field --file "$plan" --path rollbackDeployment.id)"
          npm run capture:vercel-provider -- \
            --selector "$PRODUCTION_ORIGIN" \
            --output .release-evidence/rollback/current-deployment.json
          npm run capture:vercel-provider -- \
            --selector "$target_id" \
            --output .release-evidence/rollback/target-deployment.json \
            --protection-output .release-evidence/rollback/target-protection.json

      - name: Fresh smoke of provider-verified target
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          target_url="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/target-deployment.json --path deployment.url)"
          restored_mode="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/rollback-plan.json --path rollbackTarget.mode)"
          args=(--mode "$restored_mode" --protection-bypass true \
            --output .release-evidence/rollback/target-smoke-fresh.json)
          if test "$restored_mode" = live; then
            args+=(--bundle-phase promotion \
              --bundle .release-evidence/rollback/previous-promotion-bundle.json)
          fi
          PROGRAMMABLE_API_BASE="$target_url" npm run smoke:chain-4663 -- "${args[@]}"

      - name: Seal fresh rollback pre-mutation state
        run: |
          checked_at="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/target-smoke-fresh.json --path checkedAt)"
          restored_mode="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/rollback-plan.json --path rollbackTarget.mode)"
          args=(
            --operation rollback
            --plan .release-evidence/rollback/rollback-plan.json
            --current-deployment .release-evidence/rollback/current-deployment.json
            --selected-deployment .release-evidence/rollback/target-deployment.json
            --selected-protection-evidence .release-evidence/rollback/target-protection.json
            --selected-smoke .release-evidence/rollback/target-smoke-fresh.json
            --checked-at "$checked_at"
            --output .release-evidence/rollback/pre-mutation-state.json
          )
          if test "$restored_mode" = live; then
            args+=(--selected-bundle .release-evidence/rollback/previous-promotion-bundle.json)
          fi
          npm run release:vercel -- create-pre-mutation-state "${args[@]}"

      - name: Reconfirm current protected main before Vercel mutation
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$(git rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse --verify origin/main^{commit})" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Roll back only to authorization-bound deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          target_id="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/rollback-plan.json --path rollbackDeployment.id)"
          ./node_modules/.bin/vercel promote "$target_id" --yes \
            --scope "$VERCEL_ORG_ID"

      - name: Provider-requery restored public deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npm run capture:vercel-provider -- --selector "$PRODUCTION_ORIGIN" --output .release-evidence/rollback/production-deployment.json

      - name: Post-rollback public smoke without bypass
        run: |
          set -euo pipefail
          restored_mode="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/rollback-plan.json --path rollbackTarget.mode)"
          args=(--mode "$restored_mode" --protection-bypass false \
            --output .release-evidence/rollback/production-smoke.json)
          if test "$restored_mode" = live; then
            args+=(--bundle-phase promotion \
              --bundle .release-evidence/rollback/previous-promotion-bundle.json)
          fi
          PROGRAMMABLE_API_BASE="$PRODUCTION_ORIGIN" npm run smoke:chain-4663 -- "${args[@]}"

      - name: Seal immutable rollback receipt
        run: |
          set -euo pipefail
          rolled_back_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          restored_mode="$(npm run --silent release:vercel -- field \
            --file .release-evidence/rollback/rollback-plan.json --path rollbackTarget.mode)"
          args=(
            --plan .release-evidence/rollback/rollback-plan.json
            --authorization .release-evidence/rollback/authorization.json
            --pre-mutation-state .release-evidence/rollback/pre-mutation-state.json
            --selected-smoke .release-evidence/rollback/target-smoke-fresh.json
            --production-deployment .release-evidence/rollback/production-deployment.json
            --production-smoke .release-evidence/rollback/production-smoke.json
            --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF"
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
            --actor "$GITHUB_ACTOR" --actor-id "$GITHUB_ACTOR_ID"
            --rolled-back-at "$rolled_back_at"
            --output .release-evidence/rollback/rollback-receipt.json
          )
          if test "$restored_mode" = live; then
            args+=(--previous-bundle .release-evidence/rollback/previous-promotion-bundle.json)
          fi
          npm run release:vercel -- create-rollback-receipt "${args[@]}"
          git diff --exit-code

      - name: Upload immutable rollback evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: developers-vercel-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-evidence/rollback
          if-no-files-found: error
          retention-days: 90
