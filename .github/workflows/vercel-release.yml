            --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" --actor-id "$GITHUB_ACTOR_ID" \
            --promoted-at "$promoted_at" \
            --output .release-evidence/promote/promotion-receipt.json
