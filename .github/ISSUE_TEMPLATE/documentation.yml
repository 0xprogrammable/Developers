name: Documentation issue
description: Report unclear, incorrect, stale, or broken developer documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: docs/guides/terminal.md or https://...
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Optional. Include evidence for claims about live deployments or behavior.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This report contains no secrets, credentials, personal data, or private vulnerability details.
          required: true
